name: Starter and solution checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make ci
  acceptance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sessions_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d sessions_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/sessions_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Эта job намеренно красная до реализации задания.
      - run: make test-acceptance
      - if: always()
        run: make test-db test-db-race
